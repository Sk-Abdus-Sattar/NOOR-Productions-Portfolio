<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We've moved – NOOR Productions</title>
<meta name="description" content="This is NOOR Productions' old website. We've moved to noorproductions.in.">
<style>
  :root{
    --bg:#06130F; --panel:#0D221C; --border:#1B4A46;
    --teal:#2DD4BF; --text:#F2EFE6; --muted:#8FA39B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; padding:28px 16px 48px;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }
  .badge{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--border);
    color:var(--muted); font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    padding:9px 16px; border-radius:999px;
  }
  .badge i{width:9px;height:9px;border-radius:50%;background:#e5646a;display:block}
  h1{font-size:clamp(26px,5vw,40px);text-align:center;line-height:1.15;font-weight:700}
  h1 span{color:var(--teal)}
  .sub{color:var(--muted);text-align:center;max-width:560px;line-height:1.5;margin-top:-8px}
  .scene{width:100%;max-width:760px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}
  .scene svg{width:100%;height:auto;display:block}
  .moved{text-align:center}
  .moved p{color:var(--muted);font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  .cta{
    display:inline-block; background:var(--teal); color:var(--bg); text-decoration:none;
    font-weight:700; font-size:clamp(20px,4.5vw,30px); padding:16px 34px; border-radius:18px;
    transition:transform .15s, box-shadow .15s;
    box-shadow:0 0 0 0 rgba(45,212,191,.5);
  }
  .cta:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(45,212,191,.35)}
  .links{
    width:100%; max-width:760px; display:grid; gap:12px;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  }
  .links a{
    display:flex; flex-direction:column; gap:4px; text-decoration:none; color:var(--text);
    background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px 18px;
    transition:border-color .15s, transform .15s;
  }
  .links a:hover{border-color:var(--teal);transform:translateY(-2px)}
  .links small{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .links b{font-size:15px;font-weight:600;word-break:break-all;color:var(--teal)}
  footer{color:var(--muted);font-size:13px;text-align:center;max-width:520px;line-height:1.5}
</style>
</head>
<body>


<h1>This website has <span>moved</span></h1>
<p class="sub">You've reached the old home of NOOR Productions. Everything we do now lives on our new website.</p>

<div class="scene">
